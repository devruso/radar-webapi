spring.application.name=RADAR
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

### Datasource (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/radar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:radar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:radar123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:60000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
# Transitional compatibility: legacy RADAR databases started at V1. The
# idempotent V0 baseline is therefore allowed to register after those versions.
spring.flyway.out-of-order=true

# Server
server.port=${SERVER_PORT:9090}

# Logging
logging.level.com.jangada.RADAR=${RADAR_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF

# Health checks used by Docker and, later, Dokku
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Ementas is an authenticated, read-only upstream. Multiple URLs are merged by
# component code; a partial source never deletes data already present in RADAR.
radar.ementas.base-urls=${EMENTAS_API_BASE_URLS:http://localhost:3333/api,https://ementas.app.ic.ufba.br/api}
radar.ementas.email=${EMENTAS_API_EMAIL:}
radar.ementas.password=${EMENTAS_API_PASSWORD:}
radar.ementas.page-size=${EMENTAS_API_PAGE_SIZE:100}
radar.catalog.sync-key=${RADAR_CATALOG_SYNC_KEY:}
radar.ofertas.import-key=${RADAR_OFERTAS_IMPORT_KEY:${RADAR_CATALOG_SYNC_KEY:}}

# Authentication. Replace this development value with a random secret of at
# least 32 bytes in every deployed environment.
radar.auth.jwt-secret=${RADAR_JWT_SECRET}
radar.auth.token-ttl=${RADAR_TOKEN_TTL:PT12H}
radar.cors.allowed-origins=${RADAR_ALLOWED_ORIGINS:http://localhost:3000}

# Springdoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Error details for debugging
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always
