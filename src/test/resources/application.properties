spring.datasource.url=jdbc:h2:mem:radar;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
logging.level.root=WARN
logging.level.com.jangada.RADAR=INFO
logging.level.org.hibernate.SQL=OFF
debug=false

radar.ementas.base-urls=http://localhost:3333/api
radar.ementas.email=
radar.ementas.password=
radar.catalog.sync-key=
radar.ofertas.import-key=
radar.auth.jwt-secret=radar-test-secret-with-at-least-32-characters
radar.auth.token-ttl=PT1H
radar.cors.allowed-origins=http://localhost:3000
